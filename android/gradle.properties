org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 defaults built-in Kotlin on; we apply the Kotlin plugin ourselves so the
# Compose / atomicfu compiler plugins and Gobley behave predictably.
android.builtInKotlin=false
# AGP 9 buildConfig/resValues default off — we use neither. Escape hatch if a
# plugin blocks the new DSL (removed in AGP 10):  android.newDsl=false

# Absolute path to `cargo` (the Gradle daemon may not have ~/.cargo/bin on PATH).
# Windows example:  C:/Users/you/.cargo/bin/cargo.exe
fortis.cargo=C:/Users/you/.cargo/bin/cargo.exe
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
